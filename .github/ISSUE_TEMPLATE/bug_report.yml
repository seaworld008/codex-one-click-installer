name: 安装失败 / Bug report
description: 报告安装失败、脚本报错或行为异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先使用最新 Release 的 `CheckOnly` 复现，并只提供去敏后的日志。
  - type: input
    id: installer_version
    attributes:
      label: 安装器版本
      description: 解压包中的 VERSION 内容，或使用的 Git commit。
      placeholder: 2.0.1 / abcdef1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 例如 Windows 10 Pro 22H2、Windows 11、macOS 15、Ubuntu 24.04
      placeholder: Ubuntu 24.04 LTS
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: CPU 架构
      options:
        - x64
        - arm64 / Apple Silicon
        - x86
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: 运行入口
      options:
        - Windows双击安装Codex.cmd
        - Windows双击更新Codex.cmd
        - install-codex.ps1
        - macOS双击安装Codex.command
        - macOS双击更新Codex.command
        - install-codex-macos.sh
        - install-codex-linux.sh
        - install-codex-unix.sh
        - 其他
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - CheckOnly（未联网验证）
        - CheckOnly + VerifyDownloads
        - 安装
        - 更新
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 下载源
      options:
        - official
        - 自定义企业源（请勿公开真实地址）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出你执行了哪些操作，以及错误出现在哪一步。
      placeholder: |
        1. 解压最新 Release
        2. 双击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 关键日志或报错
      description: 请去掉 API Key、token、auth.json、用户名、私有域名、代理凭据和公司内部地址后再粘贴。
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经去掉了日志中的真实 API Key、token 和私有下载地址。
          required: true
        - label: 我没有附加 auth.json、downloads.local.json 或其他认证文件。
          required: true
        - label: 我使用的是本仓库最新 Release，并填写了 VERSION。
          required: true
